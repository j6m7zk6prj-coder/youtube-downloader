name: Compiler l'exe Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : recompile avec la dernière version de yt-dlp

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -U pip pyinstaller pywebview yt-dlp imageio-ffmpeg

      - name: Compiler YouTubeDownloader.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name YouTubeDownloader
          --icon icon.ico
          --add-data "ui.html;."
          --collect-all yt_dlp --collect-all imageio_ffmpeg --collect-all webview
          YouTubeDownloader.py

      - name: Test de démarrage (interface + pont JavaScript)
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\YouTubeDownloader.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "Délai dépassé"; exit 1 }
          $r = Get-Content selftest_result.txt -ErrorAction SilentlyContinue
          Write-Host "Résultat : $r"
          if ($r -ne "OK") { exit 1 }

      - name: Publier dans Actions (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: dist/YouTubeDownloader.exe

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: YouTubeDownloader v${{ github.run_number }}
          body: |
            Téléchargez **YouTubeDownloader.exe** ci-dessous et double-cliquez dessus.
            Test de démarrage automatique : ${{ steps.selftest.outcome }}
          files: dist/YouTubeDownloader.exe
