name: Compiler l'exe Windows

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : recompile avec la dernière version de yt-dlp

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -U pip pyinstaller yt-dlp imageio-ffmpeg

      - name: Compiler YouTubeDownloader.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name YouTubeDownloader
          --collect-all yt_dlp --collect-all imageio_ffmpeg
          YouTubeDownloader.py

      - name: Publier dans Actions (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader
          path: dist/YouTubeDownloader.exe

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: YouTubeDownloader v${{ github.run_number }}
          body: Téléchargez **YouTubeDownloader.exe** ci-dessous et double-cliquez dessus.
          files: dist/YouTubeDownloader.exe
