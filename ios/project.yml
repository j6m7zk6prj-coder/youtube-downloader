# Projet Xcode de l'app iPhone (généré par XcodeGen sur GitHub).
name: Downloader
options:
  bundleIdPrefix: com.tepsko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  Downloader:
    type: application
    platform: iOS
    sources:
      - path: Downloader
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Downloader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Downloader se connecte à ton PC sur le Wi-Fi pour télécharger les vidéos."
        NSBonjourServices: ["_ytdl._tcp"]
        NSPhotoLibraryAddUsageDescription: "Downloader enregistre les vidéos téléchargées dans Photos."
        NSPhotoLibraryUsageDescription: "Downloader relit les vidéos enregistrées pour les afficher dans l’historique."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tepsko.downloader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
